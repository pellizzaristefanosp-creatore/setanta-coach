<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<title>Animation Studio · prova 30 s</title>
<style>
  html, body { margin: 0; background: #1d1712; }
  #stage { position: relative; width: 720px; height: 1280px; overflow: hidden; background: #fbf6ee; font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, system-ui, sans-serif; }
  canvas { display: block; }
  .ov { position: absolute; pointer-events: none; }
  #title { left: 50%; transform: translateX(-50%); white-space: nowrap; top: 48px; text-align: center; font-weight: 850; font-size: 34px; color: #fff; background: #2b2118; padding: 8px 22px; border-radius: 16px; letter-spacing: -0.02em; opacity: 0; }
  #subtitle { left: 40px; right: 40px; bottom: 54px; text-align: center; font-size: 27px; line-height: 1.3; font-weight: 650; color: #2b2118; background: rgba(255,255,255,.92); border-radius: 22px; padding: 14px 20px; box-shadow: 0 6px 0 rgba(43,33,24,.12); border: 3px solid #2b2118; }
  #subtitle b { display: block; font-size: 18px; letter-spacing: .12em; text-transform: uppercase; color: #c4471d; }
  .label { font-weight: 800; font-size: 26px; padding: 6px 14px; border-radius: 14px; background: #fff; border: 3px solid currentColor; opacity: 0; transform: translateY(10px) scale(.9); }
  #note { left: 24px; top: 24px; font-size: 18px; color: #6b5b4b; background: rgba(255,255,255,.85); border-radius: 10px; padding: 6px 10px; opacity: 0; }
  #src { right: 24px; top: 24px; font-size: 18px; color: #6b5b4b; background: rgba(255,255,255,.85); border-radius: 10px; padding: 6px 10px; opacity: 0; }
  #iris { inset: 0; background: #fbf6ee; clip-path: circle(0% at 50% 45%); }
  #divider { left: 0; right: 0; height: 6px; background: #2b2118; opacity: 0; }
</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
</head>
<body>
<div id="stage">
  <div id="note" class="ov">Schema semplificato · non in scala</div>
  <div id="src" class="ov">Fonte: lezione 5.1, slide 6</div>
  <div id="title" class="ov">Teoria dei filamenti scorrevoli</div>
  <div id="lab-actin" class="ov label" style="color:#2f7a4c">Actina · sottile</div>
  <div id="lab-myosin" class="ov label" style="color:#c4471d">Miosina · spessa</div>
  <div id="lab-ca" class="ov label" style="color:#b7860b">Ca²⁺ · calcio</div>
  <div id="lab-site" class="ov label" style="color:#7a3fb0">Sito di legame</div>
  <div id="lab-ends" class="ov label" style="color:#2563c9">Estremità del sarcomero</div>
  <div id="divider" class="ov"></div>
  <div id="subtitle" class="ov"></div>
  <div id="iris" class="ov"></div>
</div>
<script type="module" src="./slice.js"></script>
</body>
</html>
